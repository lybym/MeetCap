name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    # A hung test must not be able to occupy a runner for hours. The suite runs in
    # well under a minute on a normal runner; this is a backstop only.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore MeetCap.slnx

      - name: Build (Release)
        run: dotnet build MeetCap.slnx -c Release --no-restore -warnaserror

      - name: Test (Release)
        run: dotnet test MeetCap.slnx -c Release --no-build --logger "console;verbosity=normal"
