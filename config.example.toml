config_version = 1

[app]
default_title = "Untitled Meeting"

[capture]
default_mode = "offline"
chunk_seconds = 60
buffer_seconds = 5
flush_interval_ms = 1000
# How long one capture track keeps retrying its configured endpoint after the device
# disappears before it reports the device unrecoverable and ends that track. Bounded by
# design; a Bluetooth headset takes seconds to reappear, hence the default. 0 disables
# device recovery entirely.
device_recovery_seconds = 20

[capture.offline]
microphone_device_id = "default"

[capture.online]
microphone_device_id = "default"
loopback_mode = "system"
render_device_id = "default"
# Used when loopback_mode = "process"
process_name = ""

[storage]
data_root = "%LOCALAPPDATA%\\MeetCap"
minimum_free_space_gb = 5

[media]
# Directory containing ffmpeg.exe and ffprobe.exe. Empty auto-detects (well-known
# install locations first, then PATH). May use an "env:NAME" reference.
ffmpeg_binary_folder = ""
# Optional working directory for FFmpeg temporary files. Empty auto-detects.
ffmpeg_temporary_folder = ""

[asr]
enabled = true
strategy = "file"
file_batch_seconds = 300
streaming_enabled = false
retry_max_attempts = 8
retry_initial_seconds = 5
retry_max_seconds = 300
final_full_session_pass = false

[asr.volcengine]
# New-console API key, sent as X-Api-Key. The endpoint family, the resource id
# (volc.seedasr.auc), the model (Seed-ASR 2.0) and the recording-file Standard service
# are fixed by the provider contract, so there is no app_id, access token, resource_id,
# or service_tier to configure. May use an "env:NAME" reference.
api_key = "env:MEETCAP_VOLCENGINE_API_KEY"
hotword_table_id = ""
request_speaker_info = true
# Estimate-only hourly rate in CNY; provider pricing is not a product guarantee.
cost_per_hour_cny = 0.8
poll_interval_seconds = 5
# Wall-clock budget for polling one job in a single command invocation.
poll_timeout_seconds = 900
http_timeout_seconds = 30

# Optional: required only for normalized WAV files above 20 MiB. Values may use env: references.
[asr.tos]
bucket = ""
region = ""
endpoint = ""
access_key = ""
secret_key = ""
# Optional cross-service authorization (speech_asr_prod -> TOS read, issue #59): with both
# keys set, the presigned GET URL is minted on the bucket's internal endpoint and travels
# as audio.role_trn, so the provider-side fetch is billed as internal egress (free in
# cn-beijing/cn-shanghai) instead of public. Signing is purely local; the upload and the
# delete keep using endpoint. Both default empty (feature off).
role_trn = ""
presign_endpoint = ""

[speakers]
enabled = true
owner_name = ""
auto_suggest = true
manual_assignment_locked = true

[speakers.identity]
provider = "sherpa_onnx_3dspeaker"
match_threshold = 0.82
match_margin = 0.08
sample_min_seconds = 5
sample_max_seconds = 15

[speakers.sherpa_onnx]
model = "3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx"
model_path = ""

[transcript]
write_jsonl = true
write_markdown = true
live_markdown = true
include_source = true
include_timestamps = true
include_speaker_labels = true

[logging]
level = "Information"
session_log = true

[retention]
automatic_delete = false

# Issue #52: process-lifecycle auto-capture (meetcap watch). Opt-in: a watched meeting
# app may stay open outside a meeting, so process presence is NOT a verified in-meeting
# signal. This records whenever a watched main process is running, which can capture
# non-meeting audio. Disabled by default. One active watched-process cohort = one
# session spanning the union of overlapping watched apps. auto_asr = false keeps
# watched recordings entirely local (no provider request, no billing).
[watch]
enabled = false
processes = ["WeMeetApp", "CloudVideo"]
poll_interval_seconds = 5
capture_mode = "online"
auto_asr = false
# When every watched process is gone, wait this long before finalizing so brief helper
# churn or an app relaunch keeps one cohort/session alive instead of producing a gap.
exit_debounce_seconds = 10
# {app} = triggering process name; {start:format} = trigger time with a .NET date format.
title_template = "{app} {start:yyyy-MM-dd HH-mm-ss}"
