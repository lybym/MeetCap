config_version = 1

[app]
default_title = "Untitled Meeting"

[capture]
default_mode = "offline"
chunk_seconds = 60
buffer_seconds = 5
flush_interval_ms = 1000

[capture.offline]
microphone_device_id = "default"

[capture.online]
microphone_device_id = "default"
loopback_mode = "system"
render_device_id = "default"
# Used when loopback_mode = "process"
process_name = ""

[storage]
data_root = "%LOCALAPPDATA%\\MeetCap"
minimum_free_space_gb = 5

[media]
# Directory containing ffmpeg.exe and ffprobe.exe. Empty auto-detects (well-known
# install locations first, then PATH). May use an "env:NAME" reference.
ffmpeg_binary_folder = ""
# Optional working directory for FFmpeg temporary files. Empty auto-detects.
ffmpeg_temporary_folder = ""

[asr]
enabled = true
strategy = "file"
file_batch_seconds = 300
streaming_enabled = false
retry_max_attempts = 8
retry_initial_seconds = 5
retry_max_seconds = 300
final_full_session_pass = false

[asr.volcengine]
# New-console API key, sent as X-Api-Key. The endpoint family, the resource id
# (volc.seedasr.auc), the model (Seed-ASR 2.0) and the recording-file Standard service
# are fixed by the provider contract, so there is no app_id, access token, resource_id,
# or service_tier to configure. May use an "env:NAME" reference.
api_key = "env:MEETCAP_VOLCENGINE_API_KEY"
hotword_table_id = ""
request_speaker_info = true
# Estimate-only hourly rate in CNY; provider pricing is not a product guarantee.
cost_per_hour_cny = 0.8
poll_interval_seconds = 5
# Wall-clock budget for polling one job in a single command invocation.
poll_timeout_seconds = 900
http_timeout_seconds = 30

[speakers]
enabled = true
owner_name = ""
auto_suggest = true
manual_assignment_locked = true

[speakers.identity]
provider = "sherpa_onnx_3dspeaker"
match_threshold = 0.82
match_margin = 0.08
sample_min_seconds = 5
sample_max_seconds = 15

[speakers.sherpa_onnx]
model = "3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx"
model_path = ""

[transcript]
write_jsonl = true
write_markdown = true
live_markdown = true
include_source = true
include_timestamps = true
include_speaker_labels = true

[logging]
level = "Information"
session_log = true

[retention]
automatic_delete = false
